<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FullHub — корпоративный портал</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-shell" id="auth-shell">
      <section class="auth-card">
        <h1>FullHub</h1>
        <p>Корпоративный портал компании</p>
        <form id="login-form" class="stack">
          <label>
            Логин (телефон)
            <input id="login-phone" required placeholder="79990000000" />
          </label>
          <label>
            Пароль
            <input id="login-password" type="password" required placeholder="••••••••" />
          </label>
          <button type="submit" class="btn btn-primary">Войти</button>
          <p class="error" id="login-error"></p>
        </form>
      </section>
    </main>

    <div class="app hidden" id="app-shell">
      <header class="topbar">
        <div>
          <strong>FullHub</strong>
          <span id="user-badge"></span>
        </div>
        <button id="logout-btn" class="btn btn-secondary">Выйти</button>
      </header>

      <section id="admin-view" class="hidden">
        <nav class="tabs">
          <button class="tab active" data-tab="employees">Сотрудники</button>
          <button class="tab" data-tab="shifts">Смены</button>
          <button class="tab" data-tab="finance">Финансы</button>
        </nav>

        <section id="tab-employees" class="tab-panel">
          <h2>Сотрудники</h2>
          <div class="card">
            <h3>Создание сотрудника</h3>
            <form id="employee-form" class="grid-form"></form>
          </div>

          <div class="card">
            <h3>Справочники</h3>
            <div id="dictionary-controls" class="dict-grid"></div>
          </div>

          <div class="card">
            <h3>Список сотрудников</h3>
            <div class="table-wrap">
              <table id="employees-table"></table>
            </div>
          </div>
        </section>

        <section id="tab-shifts" class="tab-panel hidden">
          <h2>Смены</h2>
          <div class="calendar-toolbar">
            <button id="prev-month" class="btn btn-secondary">←</button>
            <strong id="calendar-title"></strong>
            <button id="next-month" class="btn btn-secondary">→</button>
          </div>
          <div id="calendar" class="calendar"></div>

          <div class="card">
            <h3 id="shift-editor-title">Смена на дату</h3>
            <form id="shift-form" class="grid-form"></form>
            <div class="table-wrap">
              <table id="day-shifts-table"></table>
            </div>
          </div>
        </section>

        <section id="tab-finance" class="tab-panel hidden">
          <h2>Финансы</h2>
          <form id="finance-filter" class="inline-form"></form>
          <div class="table-wrap">
            <table id="finance-table"></table>
          </div>
        </section>
      </section>

      <section id="employee-view" class="hidden">
        <h2>Личный кабинет сотрудника</h2>
        <div id="employee-profile" class="card"></div>
        <div class="card">
          <h3>Мои смены</h3>
          <div class="table-wrap"><table id="my-shifts-table"></table></div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
